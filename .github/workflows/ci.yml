# CI: everything runs in the dev image (docker/Dockerfile: oracle PHP 8.5.7 +
# the pinned Rust toolchain), exactly as it runs locally through docker/run.sh.
#
#   1. build the workspace (release)
#   2. cargo test --release — the differential tests have their oracle here
#   3. baseline/gate.sh — zero pass→fail on php-src's tests/ + Zend/tests/
#      (php-src checked out at the oracle's tag php-8.5.7)
#
# Hosted runners are linux/amd64; the baseline was captured on linux/arm64.
# A pass→fail on an untouched tree is an architecture difference to triage,
# not a regression.
#
# Replaces upstream's ci.yml (only ran on `main`, called upstream harness
# scripts this fork deleted, and had no oracle) and the earlier
# phpt-regression-gate.yml (git refused the php-src mount: safe.directory).
name: CI

on:
  push:
    branches: [next]
    paths:
      - 'php-rust/crates/**'
      - 'php-rust/Cargo.toml'
      - 'php-rust/Cargo.lock'
      - 'php-rust/rust-toolchain.toml'
      - 'baseline/**'
      - 'docker/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [next]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout fork
        uses: actions/checkout@v5
        with:
          path: php-rust
      - name: Checkout php-src (corpus) at the oracle's tag
        uses: actions/checkout@v5
        with:
          repository: php/php-src
          ref: php-8.5.7
          path: php-src
      - name: Build dev image
        run: docker build -t rustyphp-dev:8.5.7 php-rust/docker
      - name: Build workspace (release)
        run: php-rust/docker/run.sh cargo build --release --locked --workspace
      # The container runs as root, where the unwritable-log-file test cannot
      # fail to write: it is skipped here (and is the one known local failure).
      - name: Unit, integration and differential tests
        run: >
          php-rust/docker/run.sh cargo test --release --locked --workspace --no-fail-fast --
          --skip build_config_to_unwritable_file_errs
      - name: Corpus regression gate
        run: php-rust/docker/run.sh ../baseline/gate.sh
