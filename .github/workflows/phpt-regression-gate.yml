# Fork addition (PLAN.md §1.2): .phpt regression gate.
# Fails if any test listed in baseline/zend-tests.pass.txt no longer passes.
#
# Runs inside the same image the baseline was measured in (docker/Dockerfile:
# oracle PHP 8.5.7 + pinned Rust toolchain), against php-src at tag php-8.5.7.
#
# STATUS: written 2026-09-30, NOT YET EXERCISED on GitHub — the fork has no
# remote yet, so this workflow has never run. The baseline was captured on
# linux/arm64 (Docker on Apple Silicon); GitHub's hosted runners are
# linux/amd64. If the first run reports pass→fail on an untouched tree, that
# is an architecture difference to triage, not a regression: re-capture the
# baseline on the CI architecture, or move the job to an arm64 runner.
# The same gate runs locally with:  docker/run.sh ../baseline/gate.sh
name: phpt regression gate

on:
  push:
    branches: [next]
    paths:
      - 'php-rust/crates/**'
      - 'php-rust/Cargo.toml'
      - 'php-rust/Cargo.lock'
      - 'php-rust/rust-toolchain.toml'
      - 'baseline/**'
      - 'docker/**'
      - '.github/workflows/phpt-regression-gate.yml'
  pull_request:
    branches: [next]
  workflow_dispatch:

concurrency:
  group: phpt-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout fork
        uses: actions/checkout@v5
        with:
          path: php-rust
      - name: Checkout php-src (corpus) at the oracle's tag
        uses: actions/checkout@v5
        with:
          repository: php/php-src
          ref: php-8.5.7
          path: php-src
      - name: Build dev image
        run: docker build -t rustyphp-dev:8.5.7 php-rust/docker
      - name: Build phpt-runner (release)
        run: php-rust/docker/run.sh cargo build --release --locked -p phpt-runner
      - name: Regression gate
        run: php-rust/docker/run.sh ../baseline/gate.sh
      - name: Upload gate output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpt-gate
          path: gate-out
          if-no-files-found: ignore
