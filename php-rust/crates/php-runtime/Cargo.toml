[package]
name = "php-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Every feature below builds an INSTRUMENTED or probe binary. None of them is
# ever used for a timing figure or a parity run.
# Op/bigram/type-pair frequency counters ($PHPR_OP_CENSUS). Even a dead branch
# per dispatch costs ~3% on op-dense code, so it only exists in these builds.
op-census = []
# GC pipeline counters ($PHPR_GC_CENSUS).
gc-census = []
# Counters for values materialised from a slot and how many of them carry an
# `Rc` (i.e. pay refcount++/--) — "the clone that dies immediately"
# ($PHPR_ZVAL_CENSUS).
zval-census = []
# Byte attribution per channel ($PHPR_MEM_CENSUS).
mem-census = ["php-types/mem-census"]
# Diagnostic: identity class-id remap and zero static base in the hot arms,
# to price the remap indirection.
relbase-probe = []
# Compile-phase counters (prelude / include-compile) for the server census.
census-instrumentation = []
# Compiles in the VmGate probe mint used by php-server's lifecycle tests; a
# build without it does not contain the symbol at all.
vm-gate-probe = []
# Layout-noise probe: a never-called #[inline(never)] #[no_mangle] pad
# function next to run_loop. An A/B against the same tree without it
# measures the code-layout noise band.
null-lever = []
# Fill/hit counters of the read-modify-write inline cache ($PHPR_IC_STATS).
ic-stats = []
# Price probe: only the `__phpr_sonda_b` builtin (clone/drop/gc_note/pair cost
# loop); its mi_heap arm needs mimalloc's extended bindings, pulled in here only.
sonda-price = ["dep:libmimalloc-sys"]

[dependencies]
php-types.workspace = true
rustc-hash.workspace = true
log.workspace = true
log4rs.workspace = true
mago-syntax = "1.30"
mago-syntax-core = "1.30"
mago-database = "1.30"
mago-span = "1.30"
bumpalo = "3"
regex = "1"
fancy-regex = "0.14"
onig = "6.5.3"
getrandom = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
unicode-segmentation = "1.13"
libc = "0.2"
rusqlite = { version = "0.40.1", features = ["bundled", "column_decltype", "column_metadata", "functions", "collation"] }
mysql = "28.0.0"
elsa = "=1.11.2"
# Native stack per Fiber (DECISION_KERNEL.md §8, owner decision 2026-10-01):
# a suspend can cross any Rust-level nesting (generators, callbacks), as in Zend.
corosensei = "0.3"
static_assertions.workspace = true
libmimalloc-sys = { version = "0.1", features = ["extended"], optional = true }

# The mem-census lib tests call mimalloc's mi_* symbols, which only the binary
# crates provide; dev-only, production builds are untouched.
[dev-dependencies]
mimalloc.workspace = true
