[package]
name = "php-types"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Instrumentation only; never in a measured or parity build.
# Length-bucket counters on every PhpStr allocation, dumped to $PHPR_STR_CENSUS.
str-census = []
# Byte attribution per channel (str/arr/obj/unit), dumped to $PHPR_MEM_CENSUS.
mem-census = []
# Diagnostic binary: hashed arrays scan linearly up to 4 entries instead of 8.
scan4 = []

[dependencies]
libc = "0.2"
rustc-hash.workspace = true
# System zlib for ext/zlib (see src/zlibio.rs): shared by the value builtins
# (gzcompress & co.) and the VM's gz stream handling, so the FFI lives once in
# the bottom crate. Byte-identical to PHP requires the system libz + PHP's exact
# deflate params — see zlibio.rs.
libz-sys = "1"
