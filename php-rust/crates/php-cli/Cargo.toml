[package]
name = "php-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ferro"
path = "src/main.rs"

[features]
# Every feature below builds an INSTRUMENTED binary: counters, probes or a
# layout perturbation. None of them is ever used for a timing figure or a
# parity run; the plain build is the one that is measured and shipped.
# Byte attribution per channel (strings/arrays/objects/units), $PHPR_MEM_CENSUS.
mem-census = ["php-runtime/mem-census", "php-types/mem-census"]
# Class-id remap cost diagnostic (see php-runtime).
relbase-probe = ["php-runtime/relbase-probe"]
# Counters for "clones that die immediately" ($PHPR_ZVAL_CENSUS=1 prints them at exit).
zval-census = ["php-runtime/zval-census"]
# Per-request allocation census line on the cli-server.
census-instrumentation = ["php-runtime/census-instrumentation"]
# Layout-noise probe: one never-called pad function next to run_loop. An A/B
# against the same tree without it measures the code-layout noise band.
null-lever = ["php-runtime/null-lever"]
# Price probe: only the __phpr_sonda_b builtin (clone/drop/gc cost loop).
sonda-price = ["php-runtime/sonda-price"]
# Op census, attributing value movements to VM sites (with mem-census).
op-census = ["php-runtime/op-census"]

[dependencies]
php-types.workspace = true
php-runtime.workspace = true
php-builtins.workspace = true
log.workspace = true
libc = "0.2"
mimalloc.workspace = true
