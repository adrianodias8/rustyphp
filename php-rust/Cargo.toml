[workspace]
resolver = "2"
members = [
    "crates/php-types",
    "crates/php-runtime",
    "crates/php-builtins",
    "crates/php-cli",
    "crates/phpt-runner",
    "crates/php-server",
    "crates/ferro-edge",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "PHP-3.01"
authors = ["php-rust-experiment"]

[workspace.dependencies]
php-types = { path = "crates/php-types" }
php-runtime = { path = "crates/php-runtime" }
php-builtins = { path = "crates/php-builtins" }
# Developer logging: the `log` facade is used across the runtime; `log4rs` is the
# configurable backend installed by the binaries (see `php_runtime::logging`).
log = "0.4"
log4rs = "1.3"
# Global allocator for the binaries (phpr / phpt-runner): the per-request
# workload is allocation-bound (Zval/PhpArray churn), where mimalloc's
# free-list sharding recovers most of what Zend's bin/chunk ZMM buys PHP.
mimalloc = "0.1"
# Non-DoS-hardened hasher for the engine's internal maps (PhpArray index,
# class/function/constant tables): stands in for Zend's precomputed
# zend_string hashes. NOT used by Vm::unit_fp (own DefaultHasher).
rustc-hash = "2"
# Compile-time (only) thread-safety invariants: RetainSet must stay !Send+!Sync;
# removing an assert is a deliberate, reviewed decision, never a casual edit.
static_assertions = "1.1"

# Release pipeline: fat LTO + single codegen unit — the 16 default CGUs are
# themselves a source of the layout lottery the null-lever bands measured
# (up to 10 ns/iter).
[profile.release]
lto = "fat"
codegen-units = 1

# Development profile: inherits release but
# keeps the incremental cache alive (fat LTO + 1 CGU disable it). Output goes to
# target/dev-release/ and is NEVER a pin, a measurement arm or a CI artifact:
# the pin recipe stays `cargo build --release` above, byte for byte.
[profile.dev-release]
inherits = "release"
incremental = true
lto = false
codegen-units = 16
