# nginx -> php-fpm for bench/drupal/bench-wrk-drupal.sh: Drupal's own index.php
# front controller over a copy of the base install.
upstream fpm { server fpm:9000; }
server {
    listen 8080;
    access_log off;
    root /scratch/drupal-b-fpm/web;
    location / { try_files $uri /index.php?$query_string; }
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_pass fpm;
    }
}
