# nginx -> php-fpm for bench/worker/bench-wrk.sh. Every request is the front
# controller (no static files), like the worker arms. 8080 = Symfony,
# 8081 = hello world.
upstream fpm { server fpm:9000; }
server {
    listen 8080;
    access_log off;
    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /work/php-rust/bench/worker/symfony-index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param SYMFONY_DIR /scratch/symfony-app;
        fastcgi_pass fpm;
    }
}
server {
    listen 8081;
    access_log off;
    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /work/php-rust/bench/worker/hello-index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass fpm;
    }
}
